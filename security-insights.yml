  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Cedar security team
      email: cedar-policy-security@lists.cncf.io
      primary: true
    policy: https://github.com/cedar-policy/cedar/blob/main/SECURITY.md
    comment: Report vulnerabilities by email, not in public issues. The team sends a non-automated acknowledgement within 1 business day and an initial assessment within 5 business days, then agrees an embargo period with the reporter before public disclosure. Fixed vulnerabilities are published at https://github.com/cedar-policy/cedar/security/advisories as GitHub security advisories.
