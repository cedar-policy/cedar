    security-policy: https://github.com/cedar-policy/cedar/blob/main/SECURITY.md
    governance: https://github.com/cedar-policy/.github/blob/main/GOVERNANCE.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/cedar-policy/cedar/releases
        comment: GitHub releases, including prebuilt cedar-policy-cli binaries built with cargo-dist.
      - uri: https://crates.io/crates/cedar-policy
        comment: Main Rust crate. Every release since 4.9.0 (February 2026) was published through crates.io trusted publishing from a GitHub Actions workflow in this repository.
      - uri: https://crates.io/crates/cedar-policy-core
        comment: Core Rust crate. Every release since 4.9.0 (February 2026) was published through crates.io trusted publishing from a GitHub Actions workflow in this repository.
      - uri: https://crates.io/crates/cedar-policy-formatter
        comment: Policy formatter crate. Every release since 4.9.0 (February 2026) was published through crates.io trusted publishing from a GitHub Actions workflow in this repository.
      - uri: https://crates.io/crates/cedar-policy-symcc
        comment: Symbolic compiler crate. Every release since 0.3.1 (March 2026) was published through crates.io trusted publishing from a GitHub Actions workflow in this repository.
      - uri: https://crates.io/crates/cedar-policy-cli
        comment: Command-line interface crate. Every release since 4.9.0 (February 2026) was published through crates.io trusted publishing from a GitHub Actions workflow in this repository.
      - uri: https://crates.io/crates/cedar-policy-validator
        comment: Validator crate, still published for the 3.x release line. Release 3.4.3 (June 2026) was published through crates.io trusted publishing from a GitHub Actions workflow in this repository.
      - uri: https://www.npmjs.com/package/@cedar-policy/cedar-wasm
        comment: WebAssembly bindings on npm.
    changelog: https://github.com/cedar-policy/cedar/blob/main/cedar-policy/CHANGELOG.md
    attestations:
      - name: npm provenance for @cedar-policy/cedar-wasm
        location: https://www.npmjs.com/package/@cedar-policy/cedar-wasm
        predicate-uri: https://slsa.dev/provenance/v1
        comment: npm has published SLSA build provenance for every version released since February 2026 (4.9.0 and later). It records that the package was built by .github/workflows/publish_wasm.yml on main, on a GitHub-hosted runner. Verify it with npm audit signatures.
  security:
    assessments:
      self:
        name: Cedar security self-assessment
        evidence: https://github.com/cedar-policy/cedar/blob/main/self-assessment.md
        date: '2026-10-28'
        comment: OSPS self-assessment of this repository, following the OpenSSF self-assessment template. It covers the actors, actions, goals and non-goals, attack surface, security functions, development practices, and security issue resolution.
      third-party:
        - name: 'Cedar, Rego, and OpenFGA Policy Languages: Comparative Language Security Assessment'
          evidence: https://github.com/trailofbits/publications/blob/master/reports/Policy_Language_Security_Comparison_and_TM.pdf
          date: '2024-08-21'
          comment: Threat model and comparative security assessment of the Cedar, Rego, and OpenFGA policy languages by Trail of Bits, commissioned by AWS.
    tools:
      - name: CodeQL
        type: SAST
        comment: GitHub code scanning default setup. Analyzes the GitHub Actions workflows and Python scripts on push, on pull requests, and weekly.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
      - name: Clippy
        type: SAST
        comment: Every crate inherits the workspace lint configuration, which forbids unsafe code and denies Clippy lints for code that can panic, such as unwrap_used, expect_used, indexing_slicing, and panic.
        rulesets:
          - https://github.com/cedar-policy/cedar/blob/main/Cargo.toml
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          adhoc:
            name: Nightly build
            predicate-uri: https://github.com/rust-lang/rust-clippy
            location: https://github.com/cedar-policy/cedar/actions/workflows/nightly_build.yml
          ci:
            name: Cargo Build & Test
            predicate-uri: https://github.com/rust-lang/rust-clippy
            location: https://github.com/cedar-policy/cedar/actions/workflows/ci.yml
      - name: OpenSSF Scorecard
        type: other
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: Scorecard supply-chain security
            predicate-uri: https://github.com/ossf/scorecard-action
            location: https://scorecard.dev/viewer/?uri=github.com/cedar-policy/cedar
      - name: cargo-audit
        type: SCA
        comment: Runs with --deny warnings on every pull request and in the nightly build.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: Cargo Build & Test
            predicate-uri: https://github.com/rustsec/rustsec/tree/main/cargo-audit
            location: https://github.com/cedar-policy/cedar/actions/workflows/ci.yml
      - name: cargo-deny
        type: SCA
        comment: Runs all checks on every pull request and in the nightly build. A separate nightly advisories check opens an issue when it fails.
        rulesets:
          - https://github.com/cedar-policy/cedar/blob/main/deny.toml
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          adhoc:
            name: Cargo audit
            predicate-uri: https://github.com/EmbarkStudios/cargo-deny-action
            location: https://github.com/cedar-policy/cedar/actions/workflows/cargo_audit.yml
          ci:
            name: Cargo Build & Test
            predicate-uri: https://github.com/EmbarkStudios/cargo-deny-action
            location: https://github.com/cedar-policy/cedar/actions/workflows/ci.yml
      - name: Dependabot
        type: SCA
        comment: Dependabot alerts and security updates are enabled. Version updates run weekly for Cargo and GitHub Actions.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
      - name: GitHub secret scanning
        type: secret
        comment: Secret scanning and push protection are enabled.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
      - name: cedar-drt
        type: fuzzing
        comment: Coverage-guided cargo-fuzz targets in cedar-spec test this repository's Rust code, either by differential testing against the Lean formal specification or by property-based testing. Long fuzzing runs happen on maintainer infrastructure outside GitHub. Their minimized corpus is published in cedar-integration-tests and refreshed with each minor release. Every pull request builds the fuzz targets against the change and runs the corpus as tests.
        rulesets:
          - https://github.com/cedar-policy/cedar-spec/tree/main/cedar-drt/fuzz/fuzz_targets
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          adhoc:
            name: Fuzzer-generated corpus tests
            predicate-uri: https://github.com/cedar-policy/cedar-spec/tree/main/cedar-drt
            location: https://github.com/cedar-policy/cedar-integration-tests/blob/main/corpus-tests.tar.gz
            comment: Minimized corpus from a 6-hour run of the abac fuzz target. Logs of the fuzzing runs are not public.
          ci:
            name: Build Downstream Dependencies
            predicate-uri: https://github.com/cedar-policy/cedar-spec/tree/main/cedar-drt
            location: https://github.com/cedar-policy/cedar/actions/workflows/build_downstream_deps.yml
