syntax = "proto3";
package cedar_policy_validator;

import "core.proto";

// the protobuf Schema message describes a schema, which may be incomplete:
// see the `external` field on EntityDecl and ActionDecl.
//
// `type_ref = i` stands for `type_defs[i]`, and `type_defs[i]` may only refer
// to `type_defs[j]` for `j < i`. The schema a message denotes is its expansion,
// obtained by replacing every `type_ref` with what it refers to. Writers use
// `type_defs` for types used more than once, whose expansion can be
// exponentially larger. The Rust reader also rejects expansions deeper than
// prost's recursion limit, which bounds messages without `type_ref`s.
message Schema {
    repeated EntityDecl entity_decls = 1;
    repeated ActionDecl action_decls = 2;
    repeated Type type_defs = 3;
}

// the protobuf EntityDecl message contains all of the schema's
// information about a single entity type.
message EntityDecl {
    cedar_policy_core.Name name = 1;
    repeated cedar_policy_core.Name descendants = 2;
    map<string, AttributeType> attributes = 3;
    optional Type tags = 5;
    repeated string enum_choices = 6;
    // True for an external declaration, whose shape is unknown. Defaults to
    // false for messages written before this field existed.
    bool external = 7;
}

// the protobuf ActionDecl message contains all of the schema's
// information about a single action.
message ActionDecl {
    cedar_policy_core.EntityUid name = 1;
    repeated cedar_policy_core.EntityUid descendants = 3;
    map<string, AttributeType> context = 4;
    repeated cedar_policy_core.Name principal_types = 5;
    repeated cedar_policy_core.Name resource_types = 6;
    // True for an external declaration, whose appliesTo is unknown. Defaults
    // to false for messages written before this field existed.
    bool external = 7;
}

message Type {
    oneof data {
        // Primitive types
        Prim prim = 1;
        // Set with the specified element type
        Type set_elem = 2;
        // Entity type
        cedar_policy_core.Name entity = 3;
        // Record type
        // Map types are not allowed inside oneof, so we can't inline the map here
        Record record = 4;
        // Extension type
        cedar_policy_core.Name ext = 5;
        // `Schema.type_defs[type_ref]`
        uint32 type_ref = 6;
    }

    enum Prim {
        String = 0;
        Bool = 1;
        Long = 2;
    }

    message Record {
        map<string, AttributeType> attrs = 1;
    }
}

message AttributeType {
    Type attr_type = 1;
    bool is_required = 2;
}

enum ValidationMode {
    Strict = 0;
    Permissive = 1;
    Partial = 2;
}
