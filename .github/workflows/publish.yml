# Note: This workflow can only be run from the 'main' branch to
# ensure that the latest version of this workflow is used.
# However, the release will not necessarily be performed from the 'main' branch
# as the input `tag` is used to determine which GitHub tag will be checked out for the release.
name: Publish Cedar crates to crates.io
on:
    # This workflow must be triggered manually.
    workflow_dispatch:
        inputs:
            target:
                required: true
                type: choice
                description: "Which crate group to publish."
                options:
                    - core
                    - symcc
                    - cli
                    - all
            tag:
                required: true
                type: string
                description: "The tag to release from."
            core_version:
                required: true
                type: string
                description: "The core crate version. Must be of the form '<MAJOR>.<MINOR>.<PATCH>'. Required for all targets, either because being published or for validation."
            symcc_version:
                required: false
                type: string
                description: "The symcc crate version. Must be of the form '<MAJOR>.<MINOR>.<PATCH>'. Required for symcc and all."
            # For now, cli_version is the same as core_version (they share the workspace version).
            cli_version:
                required: false
                type: string
                description: "The CLI crate version. Must be of the form '<MAJOR>.<MINOR>.<PATCH>'. Required for cli and all."
            cli_tag:
                required: false
                type: string
                description: "The CLI tag (e.g., cedar-policy-cli-v4.11.0). Required for cli and all targets. Used to identify the CLI release."
# Declare default permissions as read only.
permissions: read-all
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            # Check that this workflow was triggered from the 'main' branch.
            - name: Validate branch
              if: github.ref != 'refs/heads/main'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: core.setFailed('This workflow must be triggered from the "main" branch.')
            # Check that the input tag is well-formed.
            # For core, cli and all, we expect a tag "v<MAJOR>.<MINOR>.<PATCH>"
            # For symcc, we expect a tag "cedar-policy-symcc-v0.<MINOR>.<PATCH>"
            # Note the explicit 0: the process will need changing once symcc is stable.
            - name: Validate tag
              run: |
                  CORE_TAG_PATTERN="^v[0-9]+\.[0-9]+\.[0-9]+$"
                  SYMCC_TAG_PATTERN="^cedar-policy-symcc-v0\.[0-9]+\.[0-9]+$"
                  CLI_TAG_PATTERN="^cedar-policy-cli-v[0-9]+\.[0-9]+\.[0-9]+$"
                  case "$TARGET" in
                      core)
                          if [[ ! "$TAG" =~ $CORE_TAG_PATTERN ]]; then
                              echo "::error::tag must match $CORE_TAG_PATTERN for target '$TARGET'"
                              exit 1
                          fi
                          ;;
                      cli)
                          if [[ -z "$CLI_TAG" ]]; then
                              echo "::error::cli_tag is required for target 'cli'"
                              exit 1
                          fi
                          if [[ ! "$CLI_TAG" =~ $CLI_TAG_PATTERN ]]; then
                              echo "::error::cli_tag must match $CLI_TAG_PATTERN for target '$TARGET'"
                              exit 1
                          fi
                          ;;
                      all)
                          if [[ ! "$TAG" =~ $CORE_TAG_PATTERN ]]; then
                              echo "::error::tag must match $CORE_TAG_PATTERN for target '$TARGET'"
                              exit 1
                          fi
                          if [[ -z "$CLI_TAG" ]]; then
                              echo "::error::cli_tag is required for target 'all'"
                              exit 1
                          fi
                          if [[ ! "$CLI_TAG" =~ $CLI_TAG_PATTERN ]]; then
                              echo "::error::cli_tag must match $CLI_TAG_PATTERN for target '$TARGET'"
                              exit 1
                          fi
                          ;;
                      symcc)
                          if [[ ! "$TAG" =~ $SYMCC_TAG_PATTERN ]]; then
                              echo "::error::tag must match $SYMCC_TAG_PATTERN for target '$TARGET'"
                              exit 1
                          fi
                          ;;
                  esac
              env:
                  TARGET: ${{ inputs.target }}
                  TAG: ${{ inputs.tag }}
                  CLI_TAG: ${{ inputs.cli_tag }}
            # Check the combination of inputs given is valid:
            # - core version is always required, and must match semver. We use core to either
            #.  validate the branch is in a good state with the expected core version dependency,
            #.  or for actually checking the core version we are releasing.
            # - symcc version is required for symcc and all targets, and must match semver pattern.
            # - cli version is required for cli and all, and must match semver pattern.
            - name: Validate inputs
              run: |
                  SEMVER_PATTERN="^[0-9]+\.[0-9]+\.[0-9]+$"
                  errors=()

                  # core_version is always required and must be semver.
                  if [[ -z "$CORE_VERSION" ]]; then
                      errors+=("core_version is required for all targets.")
                  elif [[ ! "$CORE_VERSION" =~ $SEMVER_PATTERN ]]; then
                      errors+=("core_version must match $SEMVER_PATTERN")
                  fi

                  # symcc_version is required for symcc and all.
                  if [[ "$TARGET" == "symcc" || "$TARGET" == "all" ]]; then
                      if [[ -z "$SYMCC_VERSION" ]]; then
                          errors+=("symcc_version is required for target '$TARGET'.")
                      elif [[ ! "$SYMCC_VERSION" =~ $SEMVER_PATTERN ]]; then
                          errors+=("symcc_version must match $SEMVER_PATTERN")
                      fi
                  fi

                  # cli_version is required for cli and all.
                  if [[ "$TARGET" == "cli" || "$TARGET" == "all" ]]; then
                      if [[ -z "$CLI_VERSION" ]]; then
                          errors+=("cli_version is required for target '$TARGET'.")
                      elif [[ ! "$CLI_VERSION" =~ $SEMVER_PATTERN ]]; then
                          errors+=("cli_version must match $SEMVER_PATTERN")
                      fi
                  fi

                  if [[ ${#errors[@]} -gt 0 ]]; then
                      for err in "${errors[@]}"; do
                          echo "::error::$err"
                      done
                      exit 1
                  fi
              env:
                  TARGET: ${{ inputs.target }}
                  CORE_VERSION: ${{ inputs.core_version }}
                  SYMCC_VERSION: ${{ inputs.symcc_version }}
                  CLI_VERSION: ${{ inputs.cli_version }}
            - name: Checkout tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.target == 'cli' && inputs.cli_tag || inputs.tag }}
                  fetch-depth: 0
            # Main is checked out into a subdirectory so the latest scripts
            # are available.  sparse-checkout ensures no Cargo.toml from main is
            # present, so a bug in the script can't accidentally validate main's
            # version.
            - name: Checkout main (for scripts)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  sparse-checkout: .github/scripts
                  path: __main
            - name: Validate cli_tag points to same commit as tag
              if: inputs.target == 'all'
              run: |
                  CORE_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG")
                  CLI_COMMIT=$(git rev-list -n 1 "refs/tags/$CLI_TAG")
                  if [[ "$CORE_COMMIT" != "$CLI_COMMIT" ]]; then
                      echo "::error::cli_tag '$CLI_TAG' ($CLI_COMMIT) does not point to the same commit as tag '$TAG' ($CORE_COMMIT)"
                      exit 1
                  fi
              env:
                  TAG: ${{ inputs.tag }}
                  CLI_TAG: ${{ inputs.cli_tag }}
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ">=3.11" # needs tomllib, in stdlib from 3.11

            # For all targets, we validate the core version in the code for the given tag
            - name: Validate core version against Cargo.toml for given tag
              run: python3 __main/.github/scripts/check-crate-version.py cedar-policy-core "$CORE_VERSION"
              env:
                  CORE_VERSION: ${{ inputs.core_version }}

            # For symcc and all targets, we validate the symcc version for the given tag
            - name: Validate symcc version against Cargo.toml for given tag
              if: inputs.target == 'symcc' || inputs.target == 'all'
              run: python3 __main/.github/scripts/check-crate-version.py cedar-policy-symcc "$SYMCC_VERSION"
              env:
                  SYMCC_VERSION: ${{ inputs.symcc_version }}

            # For now, cli_version is the same as core_version (they share the workspace version).
            # We still additionally validate the cli version for the given tag.
            - name: Validate cli version against Cargo.toml
              if: inputs.target == 'cli' || inputs.target == 'all'
              run: python3 __main/.github/scripts/check-crate-version.py cedar-policy-cli "$CLI_VERSION"
              env:
                  CLI_VERSION: ${{ inputs.cli_version }}
    publish-core:
        if: inputs.target == 'core'
        needs: [validate]
        # Validate succeeded for core:
        # - the given tag matches the core tag format (i.e. tag is v<MAJOR>.<MINOR>.<PATCH>)
        # - the workspace version in the root Cargo.toml is the provided core version
        runs-on: ubuntu-latest
        environment: release # See https://github.com/cedar-policy/cedar/settings/environments
        permissions:
            id-token: write # Required for OIDC token exchange
        steps:
            - name: Checkout tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.tag }}
            - name: Configure rust toolchain
              run: rustup update stable && rustup default stable
            - name: Authenticate with crates.io
              id: auth
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
            - name: Publish to crates.io
              # Order matters: dependencies must be listed before dependents.
              # cedar-policy-validator is conditionally published for backwards compatibility.
              # If we ever need to publish it again, use the core target.
              run: |
                  if [ -f "cedar-policy-validator/Cargo.toml" ]; then
                      cargo publish -p cedar-policy-core -p cedar-policy-validator -p cedar-policy-formatter -p cedar-policy
                  else
                      cargo publish -p cedar-policy-core -p cedar-policy-formatter -p cedar-policy
                  fi
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
    publish-symcc:
        if: inputs.target == 'symcc'
        needs: [validate]
        # Validate succeeded for symcc:
        # - the given tag matches the symcc tag format (i.e. tag is cedar-policy-symcc-v0.<MINOR>.<PATCH>)
        # - the workspace version in the root Cargo.toml is the provided core version
        # - the version of the symcc package in its Cargo.toml is the provided symcc version
        runs-on: ubuntu-latest
        environment: release # See https://github.com/cedar-policy/cedar/settings/environments
        permissions:
            id-token: write # Required for OIDC token exchange
        steps:
            - name: Checkout tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.tag }}
            - name: Configure rust toolchain
              run: rustup update stable && rustup default stable
            - name: Authenticate with crates.io
              id: auth
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
            - name: Publish to crates.io
              run: cargo publish -p cedar-policy-symcc
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
    publish-cli:
        if: inputs.target == 'cli'
        needs: [validate]
        # Validate succeeded for cli:
        # - the given cli_tag matches the CLI tag format (i.e. cedar-policy-cli-v<MAJOR>.<MINOR>.<PATCH>)
        # - the workspace version in the root Cargo.toml is the provided core version
        # - the workspace version in the root Cargo.toml is the provided cli version
        runs-on: ubuntu-latest
        environment: release # See https://github.com/cedar-policy/cedar/settings/environments
        permissions:
            id-token: write # Required for OIDC token exchange
        steps:
            - name: Checkout tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.cli_tag }}
            - name: Configure rust toolchain
              run: rustup update stable && rustup default stable
            - name: Authenticate with crates.io
              id: auth
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
            - name: Publish to crates.io
              run: cargo publish -p cedar-policy-cli
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
    publish-all:
        if: inputs.target == 'all'
        needs: [validate]
        # Validate succeeded for all:
        # - the given tag matches the core tag format (i.e. tag is v<MAJOR>.<MINOR>.<PATCH>)
        # - the workspace version in the root Cargo.toml is the provided core version
        # - the version of the symcc package in its Cargo.toml is the provided symcc version
        # - the workspace version in the root Cargo.toml is the provided cli version
        runs-on: ubuntu-latest
        environment: release # See https://github.com/cedar-policy/cedar/settings/environments
        permissions:
            id-token: write # Required for OIDC token exchange
        steps:
            - name: Checkout tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.tag }}
            - name: Configure rust toolchain
              run: rustup update stable && rustup default stable
            - name: Authenticate with crates.io
              id: auth
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
            - name: Publish to crates.io
              # Order matters: dependencies must be listed before dependents.
              run: cargo publish -p cedar-policy-core -p cedar-policy-formatter -p cedar-policy -p cedar-policy-symcc -p cedar-policy-cli
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
    # After a successful publish, check that every crate published by this run is available on
    # crates.io, and for the CLI that `cargo install` works and the installed binary has the
    # published version. This job uses no environment, so re-running it needs no approval.
    verify-crates-io:
        needs: [publish-core, publish-symcc, publish-cli, publish-all]
        # Without a status check function, this job would be skipped because three of its `needs`
        # are always skipped. Exactly one publish job runs; proceed only if it succeeded.
        if: >-
            !cancelled() &&
            (needs.publish-core.result == 'success' ||
             needs.publish-symcc.result == 'success' ||
             needs.publish-cli.result == 'success' ||
             needs.publish-all.result == 'success')
        runs-on: ubuntu-latest
        steps:
            # Only used to find out whether publish-core also published cedar-policy-validator,
            # which it does when the tag still has that crate.
            - name: Checkout tag
              if: inputs.target == 'core'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  sparse-checkout: cedar-policy-validator
                  path: __tag
            - name: Checkout main (for scripts)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  sparse-checkout: .github/scripts
                  path: __main
            # The script only uses the standard library, so the runner's python3 is enough.
            # The list of crates must match the `cargo publish` commands in the publish jobs above.
            - name: Wait for crates on crates.io
              run: |
                  crates=()
                  case "$TARGET" in
                      core)
                          crates=("cedar-policy-core=$CORE_VERSION" "cedar-policy-formatter=$CORE_VERSION" "cedar-policy=$CORE_VERSION")
                          if [[ -f __tag/cedar-policy-validator/Cargo.toml ]]; then
                              crates+=("cedar-policy-validator=$CORE_VERSION")
                          fi
                          ;;
                      symcc)
                          crates=("cedar-policy-symcc=$SYMCC_VERSION")
                          ;;
                      cli)
                          crates=("cedar-policy-cli=$CLI_VERSION")
                          ;;
                      all)
                          crates=("cedar-policy-core=$CORE_VERSION" "cedar-policy-formatter=$CORE_VERSION" "cedar-policy=$CORE_VERSION" "cedar-policy-symcc=$SYMCC_VERSION" "cedar-policy-cli=$CLI_VERSION")
                          ;;
                  esac
                  python3 __main/.github/scripts/wait-for-published.py crates "${crates[@]}" --initial-delay 60 --interval 30 --timeout 600
              env:
                  TARGET: ${{ inputs.target }}
                  CORE_VERSION: ${{ inputs.core_version }}
                  SYMCC_VERSION: ${{ inputs.symcc_version }}
                  CLI_VERSION: ${{ inputs.cli_version }}
            - name: Configure rust toolchain
              if: inputs.target == 'cli' || inputs.target == 'all'
              run: rustup update stable && rustup default stable
            # Installs into a fresh root so that no other `cedar` binary on the runner is checked.
            # The sparse index can lag behind the API, so the install is retried.
            - name: Install the CLI from crates.io and check its version
              if: inputs.target == 'cli' || inputs.target == 'all'
              run: |
                  ROOT="$RUNNER_TEMP/cedar-cli"
                  for attempt in 1 2 3; do
                      if cargo install cedar-policy-cli --version "$CLI_VERSION" --locked --root "$ROOT"; then
                          break
                      fi
                      if [[ "$attempt" == 3 ]]; then
                          echo "::error::cargo install cedar-policy-cli --version $CLI_VERSION --locked failed 3 times."
                          exit 1
                      fi
                      sleep 60
                  done
                  # Prints e.g. `cedar-policy-cli 4.15.0`.
                  OUTPUT=$("$ROOT/bin/cedar" --version)
                  echo "cedar --version: $OUTPUT"
                  if [[ "${OUTPUT##* }" != "$CLI_VERSION" ]]; then
                      echo "::error::The installed cedar binary reports '$OUTPUT', expected version $CLI_VERSION."
                      exit 1
                  fi
              env:
                  CLI_VERSION: ${{ inputs.cli_version }}
    # After a successful publish of core and/or symcc, open a PR against 'main' that replaces
    # the "Coming soon" placeholder (written by cargo-release, see scripts/new_minor.sh)
    # in the released versions' CHANGELOG.md headings with today's date.
    # The CLI and wasm changelogs have no dates in their headings, so there is nothing to do for 'cli'.
    update-changelog-dates:
        needs: [publish-core, publish-symcc, publish-all]
        # Without a status check function, this job would be skipped because two of its `needs`
        # are always skipped. Exactly one publish job runs; proceed only if it succeeded.
        if: >-
            !cancelled() &&
            (needs.publish-core.result == 'success' ||
             needs.publish-symcc.result == 'success' ||
             needs.publish-all.result == 'success')
        runs-on: ubuntu-latest
        permissions:
            contents: write # Push the branch
            pull-requests: write # Open the PR
        steps:
            # The changelogs are maintained on 'main' only (release branches have stubs),
            # so the PR always targets 'main', even for patch releases cut from a release branch.
            - name: Checkout main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
            # The script only uses the standard library, so the runner's python3 is enough.
            - name: Set release dates
              run: |
                  DATE=$(date -u +%Y-%m-%d)
                  if [[ "$TARGET" == "core" || "$TARGET" == "all" ]]; then
                      python3 .github/scripts/set-changelog-release-date.py cedar-policy/CHANGELOG.md "$CORE_VERSION" "$DATE"
                  fi
                  if [[ "$TARGET" == "symcc" || "$TARGET" == "all" ]]; then
                      python3 .github/scripts/set-changelog-release-date.py cedar-policy-symcc/CHANGELOG.md "$SYMCC_VERSION" "$DATE"
                  fi
              env:
                  TARGET: ${{ inputs.target }}
                  CORE_VERSION: ${{ inputs.core_version }}
                  SYMCC_VERSION: ${{ inputs.symcc_version }}
            - name: Open pull request
              run: |
                  if git diff --quiet; then
                      echo "::notice::Changelog release dates are already set; no PR needed."
                      exit 0
                  fi
                  BRANCH="automation/changelog-release-date-$TAG"
                  if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
                      echo "::notice::A PR from $BRANCH is already open."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$BRANCH"
                  git commit -s -a -m "Set CHANGELOG release dates for $TAG"
                  git push origin "$BRANCH"
                  gh pr create \
                      --base main \
                      --head "$BRANCH" \
                      --title "Set CHANGELOG release dates for $TAG" \
                      --body "Automated PR opened by the [publish workflow run]($RUN_URL) for \`$TAG\` (target \`$TARGET\`). It replaces the placeholder in the CHANGELOG.md headings of the published versions with the publication date."
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}
                  TARGET: ${{ inputs.target }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
